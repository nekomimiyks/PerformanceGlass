[package]
name = "performance-glass"
version = "0.1.14"
edition = "2021"
description = "軽量なWindows常駐パフォーマンスモニター"
license = "MIT"

[dependencies]
windows-sys = { version = "0.59.0", features = ["Wdk_Graphics_Direct3D", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.58.0", features = ["ApplicationModel", "Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Rpc", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
